name: Publish profile cards

on:
  schedule:
    - cron: "06 7 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p site

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Yougo-rgb&theme=catppuccin_mocha&hide_border=false&include_all_commits=true
          path: site/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Yougo-rgb&theme=catppuccin_mocha&hide_border=false&layout=compact&langs_count=8
          path: site/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate GitHub streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Yougo-rgb&theme=catppuccin_mocha&hide_border=false
          path: site/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
